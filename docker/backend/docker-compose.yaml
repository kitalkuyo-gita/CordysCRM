# ============================================================================
# CordysCRM Backend Layer - Docker Compose
# ============================================================================
# Services: Spring Boot App, MCP Server, Cockpit, Health Monitor
# Usage: docker compose -f docker/backend/docker-compose.yaml up -d
# ============================================================================

services:
  # -------------------------------------------------------------------------
  # CordysCRM Backend - Main Application
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ../..
      dockerfile: docker/backend/Dockerfile
    container_name: cordys-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    environment:
      # Database
      - MYSQL_HOST=cordys-mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=cordys-crm
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-CordysCRM@mysql}
      # Redis
      - REDIS_HOST=cordys-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-CordysCRM@redis}
      # Application
      - CORDYS_SECRET_KEY=${CORDYS_SECRET_KEY:-9a9rdqPlTqhpZzkq}
      - SPRING_PROFILES_ACTIVE=docker
      - TZ=Asia/Shanghai
      # JVM Tuning
      - JAVA_OPTIONS=-Dfile.encoding=utf-8 -Djava.awt.headless=true -XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseStringDeduplication -XX:+ParallelRefProcEnabled --add-opens java.base/jdk.internal.loader=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED
      # Version
      - CRM_VERSION=${CRM_VERSION:-latest}
    volumes:
      - cordys_files:/opt/cordys/data/files
      - cordys_logs:/opt/cordys/logs
      - ./config:/opt/cordys/conf:ro
    networks:
      - cordys-net
    depends_on:
      cordys-mysql:
        condition: service_healthy
      cordys-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/front/account/info"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  # -------------------------------------------------------------------------
  # MySQL 8.0
  # -------------------------------------------------------------------------
  cordys-mysql:
    image: mysql:8.0
    container_name: cordys-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CordysCRM@mysql}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cordys-crm}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - cordys-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # -------------------------------------------------------------------------
  # Redis 7
  # -------------------------------------------------------------------------
  cordys-redis:
    image: redis:7-alpine
    container_name: cordys-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-CordysCRM@redis}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
    networks:
      - cordys-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-CordysCRM@redis}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  mysql_data:
    driver: local
    name: cordys-mysql-data
  redis_data:
    driver: local
    name: cordys-redis-data
  cordys_files:
    driver: local
    name: cordys-files
  cordys_logs:
    driver: local
    name: cordys-logs

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  cordys-net:
    driver: bridge
    name: cordys-network
