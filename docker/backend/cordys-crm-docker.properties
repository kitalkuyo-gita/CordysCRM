# ============================================================================
# CordysCRM Backend - Docker Environment Configuration
# ============================================================================
# This configuration is used when running in Docker container
# with external MySQL and Redis services
# ============================================================================

logger.sql.level=info
management.endpoints.enabled-by-default=true
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health,info,metrics

springdoc.api-docs.groups.enabled=true
spring.freemarker.check-template-location=false
spring.groovy.template.check-template-location=false

# ============================================================================
# MySQL Configuration (External Docker Service)
# ============================================================================
mysql.embedded.enabled=false
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:cordys-crm}?autoReconnect=false&useUnicode=true&characterEncoding=UTF-8&characterSetResults=UTF-8&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&useSSL=false&sessionVariables=sql_mode=%27STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION%27
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:CordysCRM@mysql}

# Session timeout
spring.session.timeout=30d

# ============================================================================
# Redis Configuration (External Docker Service)
# ============================================================================
redis.embedded.enabled=false
spring.data.redis.host=${REDIS_HOST:cordys-redis}
spring.data.redis.password=${REDIS_PASSWORD:CordysCRM@redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=10000
spring.session.redis.repository-type=indexed

# ============================================================================
# MCP Server Configuration
# ============================================================================
mcp.embedded.enabled=false
cordys.crm.url=http://localhost:8081
spring.mvc.async.request-timeout=60000
spring.ai.mcp.server.type=ASYNC
spring.ai.mcp.server.name=cordys-crm-mcp-server
spring.ai.mcp.server.version=1.0.0

# ============================================================================
# Security Configuration
# ============================================================================
allowed.ip.ranges.enabled=false
allowed.ip.ranges=

# List of URLs that require XSS filtering
xss.protection.url.list=/account/follow/**,/announcement/add

# Secret key for Cordys applications (CHANGE IN PRODUCTION!)
cordys.secret.key=${CORDYS_SECRET_KEY:9a9rdqPlTqhpZzkq}

# ============================================================================
# Cockpit Configuration
# ============================================================================
cockpit.embedded.enabled=false

# ============================================================================
# JVM Settings (for reference - set via JAVA_OPTIONS env var)
# ============================================================================
# server.port=8081 (default, keep as-is)
# spring.threads.virtual.enabled=true (configured in commons.properties)
