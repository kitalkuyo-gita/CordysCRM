# ============================================================================
# CordysCRM Frontend Layer - Docker Compose
# ============================================================================
# Services: Nginx (Vue 3 SPA), Optional: Certbot for SSL
# Usage: docker compose -f docker/frontend/docker-compose.yaml up -d
# ============================================================================

services:
  # -------------------------------------------------------------------------
  # Nginx - Frontend Static Files & Reverse Proxy
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ../..
      dockerfile: docker/frontend/Dockerfile
      args:
        - NODE_VERSION=22
    container_name: cordys-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_SSL_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    networks:
      - cordys-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "5"

  # -------------------------------------------------------------------------
  # Backend Service (referenced by frontend proxy)
  # -------------------------------------------------------------------------
  backend:
    image: cordys-crm-backend:latest
    container_name: cordys-backend
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      - MYSQL_HOST=cordys-mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=cordys-crm
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-CordysCRM@mysql}
      - REDIS_HOST=cordys-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-CordysCRM@redis}
      - CORDYS_SECRET_KEY=${CORDYS_SECRET_KEY:-9a9rdqPlTqhpZzkq}
      - TZ=Asia/Shanghai
      - JAVA_OPTIONS=-Dfile.encoding=utf-8 -Djava.awt.headless=true -XX:+UseG1GC -XX:MaxRAMPercentage=75.0 --add-opens java.base/jdk.internal.loader=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED
    volumes:
      - cordys_files:/opt/cordys/data/files
      - cordys_logs:/opt/cordys/logs
    networks:
      - cordys-net
    depends_on:
      cordys-mysql:
        condition: service_healthy
      cordys-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/front/account/info"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M

  # -------------------------------------------------------------------------
  # MySQL (referenced by backend)
  # -------------------------------------------------------------------------
  cordys-mysql:
    image: mysql:8.0
    container_name: cordys-mysql
    restart: unless-stopped
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CordysCRM@mysql}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cordys-crm}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cordys-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-CordysCRM@mysql}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # -------------------------------------------------------------------------
  # Redis (referenced by backend)
  # -------------------------------------------------------------------------
  cordys-redis:
    image: redis:7-alpine
    container_name: cordys-redis
    restart: unless-stopped
    expose:
      - "6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-CordysCRM@redis}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - cordys-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-CordysCRM@redis}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  mysql_data:
    driver: local
    name: cordys-mysql-data
  redis_data:
    driver: local
    name: cordys-redis-data
  nginx_cache:
    driver: local
  nginx_logs:
    driver: local
  cordys_files:
    driver: local
    name: cordys-files
  cordys_logs:
    driver: local
    name: cordys-logs

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  cordys-net:
    driver: bridge
    name: cordys-network
